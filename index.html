<!doctype html>

<head>
<meta charset="utf-8">

<title>Stundennachweis</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#17191c;--muted:#6c727a;--line:#d7dbe0;--accent:#3157d5;--sun:#f4a900;--worked:#eaf0ff;--valid:#e4f6e7;--invalid:#fde5e5}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:980px;margin:auto;padding:16px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;margin:0}.iconbtn,.btn,select,input,textarea{font:inherit}.iconbtn,.btn{border:0;border-radius:12px;background:#fff;padding:11px 14px;box-shadow:0 1px 5px #0001}.btn.primary{background:var(--accent);color:#fff}
.monthbar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-bottom:12px}.monthbar select{text-align:center;border:0;border-radius:12px;padding:12px;background:#fff}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}.week div{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:86px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px;position:relative;text-align:left}
.day.empty{visibility:hidden}.day.sun,.day.holiday{border-color:#e6a600}.num{font-weight:700}.hours{font-size:12px;margin-top:12px;color:var(--accent);font-weight:700}.day.worked{background:var(--worked)}.day.valid{background:var(--valid);border-color:#8fc79a}.day.invalid{background:var(--invalid);border-color:#e2a0a0}
.footerActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}.sheet.open{display:flex}.panel{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.panelInner{max-width:700px;margin:auto}
.panelhead{display:flex;justify-content:space-between;align-items:center}.panel h2{margin:0}
.datehead{display:grid;grid-template-columns:42px minmax(100px,1fr) 42px auto 42px;gap:8px;align-items:center;margin-bottom:14px}
.datehead h2{text-align:center;white-space:nowrap}
.shift-fd{background:#eef5ff!important;border-color:#bfd4f5!important}
.shift-sd{background:#fff3e8!important;border-color:#f2c79e!important}
.shift-note{height:46px!important;min-height:46px!important;resize:vertical}
.inline-time{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px;align-items:center}
.inline-time>span{font-size:13px;font-weight:700;color:var(--muted)}
.total-display{height:46px;border:1px solid var(--line);border-radius:10px;padding:11px;background:#f4f6f8;font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
.panel{background:#f4efff!important}
.datehead .navday{background:#dbeafe!important;color:#2457b8!important;font-size:30px!important;font-weight:700!important;line-height:1!important;padding:5px 10px!important}
.inline-small{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center}
.inline-small>span{font-size:13px;font-weight:700;color:var(--muted)}
.inline-small input{min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}.full{grid-column:1/-1}.calcbox{background:#f4f6f8;border-radius:12px;padding:12px;margin:12px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.calcbox b{display:block;font-size:17px}
.settings{position:fixed;inset:0;background:#fff;z-index:30;display:none;padding:20px}.settings.open{display:block}.settings .inner{max-width:600px;margin:auto}
@media(max-width:600px){.app{padding:10px}.day{min-height:70px;padding:5px}.hours{font-size:10px;margin-top:9px}h1{font-size:19px}}
/* PRINT: same geometry as the previously approved A4 timesheet. */
#printPage{display:none}
@media print{
 body>*:not(#printPage){display:none!important}
 #printPage{display:block!important}
 @page{size:A4 portrait;margin:4mm}
 html,body{margin:0!important;padding:0!important;width:100%!important;height:auto!important;overflow:visible!important}
 #printPage{
   font-family:Arial,sans-serif;color:#20211f;
   width:100%!important;max-width:100%!important;
   margin:0!important;padding:2mm!important;box-sizing:border-box!important;
   transform:scaleY(1.27)!important;transform-origin:top left!important;
 }
 .pTitle{text-align:center;font-weight:700;font-size:14px;margin:0 0 3mm}
 .pInfo{font-size:9px;display:grid;grid-template-columns:1fr 1fr;gap:1mm 5mm;margin-bottom:2mm}
 .pTable{
   width:87%!important;max-width:87%!important;margin:0 auto 0 0!important;
   border-collapse:collapse;table-layout:fixed;font-size:9px
 }
 .pTable th,.pTable td{
   border:1px solid #30312e;text-align:center;padding:0 1px;
   overflow:hidden;white-space:nowrap
 }
 .pTable thead tr:first-child th{background:#353633;color:#fff}
 .pTable thead tr:nth-child(2) th{background:#d2d3d0;color:#111}
 .pTable .sun,.pTable .holiday{background:#f4a900}
 .pTable .entered{color:#123cff}
 .pBottom{width:87%!important;font-size:8px;margin-top:2mm}
 .signs{display:flex;justify-content:space-between;margin-top:4mm}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>

<style id="editor-color-theme-v8">
/* Entry dialog: compact, colorful, but still readable */
.sheet .panel{
  background:linear-gradient(180deg,#f3efff 0%,#eef4ff 100%)!important;
}

}

  border-radius:9px!important;
}

}

}

}
.shift-sd .total-display{
  background:#ffe0bd!important;
  border-color:#e9b77f!important;
  color:#8b4817;
}

/* Pause / FT / RB: same width and same field height */
.sheet .triple-row{
  display:grid!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:8px!important;
}
.sheet .triple-row .inline-small{
  display:grid!important;
  grid-template-columns:1fr!important;
  gap:4px!important;
  min-width:0!important;
}
.sheet .triple-row .inline-small>span{
  text-align:center;
  border-radius:8px;
  padding:4px 2px;
}
.sheet .triple-row .inline-small:nth-child(1)>span{background:#e7dcff;color:#583c91}
.sheet .triple-row .inline-small:nth-child(2)>span{background:#ffe8b9;color:#815a0a}
.sheet .triple-row .inline-small:nth-child(3)>span{background:#dff3ea;color:#23684f}
.sheet .triple-row input{
  width:100%!important;
  min-width:0!important;
}

/* Summary gets its own coordinated colors */
.sheet .calcbox{
  background:#e7e0f8!important;
  border:1px solid #cfc1ed;
  padding:9px!important;
  gap:7px!important;
}
.sheet .calcbox>div{
  border-radius:10px;
  padding:8px;
  font-size:12px;
}
.sheet .calcbox>div:nth-child(1){background:#dcecff;color:#174f84}
.sheet .calcbox>div:nth-child(2){background:#ffe2c3;color:#8b4b19}
.sheet .calcbox>div:nth-child(3){background:#ddf3e5;color:#226344}
.sheet .calcbox>div:nth-child(4){background:#ffe0e6;color:#8b3146}
.sheet .calcbox b{font-size:16px;margin-top:2px}

/* Main save action */
#saveDay{
  background:linear-gradient(90deg,#5068d8,#7356c8)!important;
  height:42px;
}
</style>

<style>

.sheet .calcbox.day-total-only>div{width:100%;text-align:center;background:#ddf3e5!important;color:#226344!important}

function pad(n){return String(n).padStart(2,"0")}
function key(d){return `${year}-${pad(month+1)}-${pad(d)}`}
function mins(v){v=(v||"").trim();if(!v||v==="–")return null;let z=v.replace(/[^\d]/g,"");let h,m;if(v.includes(":")){[h,m]=v.split(":").map(Number)}else if(z.length<=2){h=+z;m=0}else if(z.length===3){h=+z[0];m=+z.slice(1)}else{h=+z.slice(0,2);m=+z.slice(2,4)}if(h>23||m>59)return null;return h*60+m}
function fmt(n){return `${pad(Math.floor(n/60))}:${pad(n%60)}`}
function norm(v){let n=mins(v);return n==null?(v||""):fmt(n)}
function totals(o,d){
 let a=mins(o.fdFrom),b=mins(o.fdTo),c=mins(o.sdFrom),e=mins(o.sdTo),p=mins(o.pause)||0;
 let fd=a!=null&&b!=null&&b>=a?b-a:0, sd=c!=null&&e!=null&&e>=c?e-c:0, total=Math.max(0,fd+sd-p);
 let dt=new Date(Date.UTC(year,month,d)), iso=key(d), special=dt.getUTCDay()===0||holidays2026.includes(iso);
 return {fd,sd,total,so:special?total:0,special};
}

}

  const ids=[o.fdPatientId,o.sdPatientId].filter(Boolean);

  });

}

async function saveWorkEntry(day,o){
  if(!currentUser) throw new Error("Nicht angemeldet");
  const date=`${year}-${pad(month+1)}-${pad(day)}`;
  const pause=mins(o.pause)||0;
  const row={user_id:currentUser.id,work_date:date,
    fd_from:mins(o.fdFrom)==null?null:norm(o.fdFrom),fd_to:mins(o.fdTo)==null?null:norm(o.fdTo),
    fd_patient_id:o.fdPatientId||null,fd_description:o.fdNote||null,
    sd_from:mins(o.sdFrom)==null?null:norm(o.sdFrom),sd_to:mins(o.sdTo)==null?null:norm(o.sdTo),
    sd_patient_id:o.sdPatientId||null,sd_description:o.sdNote||null,
    pause_minutes:pause,ft:o.ft||null,rb:o.rb||null,updated_at:new Date().toISOString()};
  const {error}=await supabaseClient.from("work_entries").upsert(row,{onConflict:"user_id,work_date"});
  if(error) throw error;
}

   const fdP=patientNameById(o.fdPatientId), sdP=patientNameById(o.sdPatientId);
   const fdInfo=[fdP?'<div class="dPatient">'+fdP+'</div>':'',o.fdNote?'<div class="dDesc">'+escapeHtml(o.fdNote)+'</div>':''].join("");
   const sdInfo=[sdP?'<div class="dPatient">'+sdP+'</div>':'',o.sdNote?'<div class="dDesc">'+escapeHtml(o.sdNote)+'</div>':''].join("");
   const used=t.total||fdP||sdP||o.fdNote||o.sdNote||o.ft||o.rb;
   rows+=`<tr class="${used?'used':''}">
    <td class="c ${hol?'holiday':sun?'sun':''}">${wd[dt.getUTCDay()]}</td>
    <td class="c ${hol?'holiday':sun?'sun':''}">${pad(d)}.${pad(month+1)}.</td>
    <td class="c">${o.fdFrom||""}</td><td class="c">${o.fdTo||""}</td>
    <td class="note">${fdInfo}</td>
    <td class="c">${o.sdFrom||""}</td><td class="c">${o.sdTo||""}</td>
    <td class="note">${sdInfo}</td>
    <td class="c">${o.pause||""}</td>
    <td class="c"><b>${t.total?fmt(t.total):""}</b></td>
    <td class="c">${o.ft||""}</td><td class="c">${o.rb||""}</td>
   </tr>`;
 }
 document.getElementById("detailPrintPage").innerHTML=`
 <div class="dReport">

    <div style="font-size:9px;margin-top:1mm">${monthNames[month]} ${year}</div></div>
    <div class="dMeta"><b>Mitarbeiter:</b> ${escapeHtml(settings.employee||"")}<br><b>Lohngruppe:</b> ${escapeHtml(settings.payGroup||"")}</div>
   </div>
   <table class="dTable">
    <colgroup>
     <col style="width:4%"><col style="width:6%">

    </tr></thead>
    <tbody>${rows}</tbody>

   <div class="dFoot">

    <div class="dSign"><span>Datum / Mitarbeiter</span><span>PDL / Verwaltung</span></div>
   </div>
 </div>`;
}
function escapeHtml(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
